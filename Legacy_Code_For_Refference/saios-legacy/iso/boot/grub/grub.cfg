if [ x$grub_platform = xxefi ]; then
    menuentry "UEFI Firmware Setup" {
        fwsetup
    }
fi

menuentry "Enroll Secure Boot keys (KeyTool)" {
    insmod chain
    chainloader /EFI/BOOT/KeyTool.efi
    boot
}
