name: SAIOS Quick CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  KERNEL_TARGET: x86_64-unknown-none
  KERNEL_BUILD_STD: -Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem

jobs:
  check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
          target: x86_64-unknown-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check syntax
        run: cargo check --no-default-features --target $KERNEL_TARGET $KERNEL_BUILD_STD --message-format=short

      - name: Run cargo test
        run: cargo test --no-default-features

      - name: Format check
        run: rustup run nightly cargo fmt --check

      - name: Clippy
        run: rustup run nightly cargo clippy --no-default-features --target $KERNEL_TARGET $KERNEL_BUILD_STD -- -D warnings

      - name: Check release metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*SAIOS_VERSION:.*"\([^"]*\)".*/\1/p' shared_version.rs)
          tag=$(sed -n 's/.*SAIOS_VERSION_TAG:.*"\([^"]*\)".*/\1/p' shared_version.rs)
          cargo_version=$(grep -A 5 '^\[workspace\.package\]' Cargo.toml | sed -n 's/^version = "\([^"]*\)".*/\1/p' | head -n 1 | tr -d '\r')
          expected_readme_line=$(printf 'Runtime version: `%s`' "$tag")

          test -n "$version"
          test -n "$tag"
          test -n "$cargo_version"
          test "$tag" = "v$version"
          test "$cargo_version" = "$version"
          test -f "RELEASE_NOTES_${tag}.md"
          grep -Fq "$expected_readme_line" README.md

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation
        run: |
          set -euo pipefail
          echo "Checking documentation..."
          [ -f "docs/core/SAIOS_SSOT.md" ] && echo "SSOT doc: OK" || (echo "SSOT doc: MISSING"; exit 1)
          [ -f "docs/core/SAIOS_SSOT_Part2.md" ] && echo "SSOT part 2 doc: OK" || (echo "SSOT part 2 doc: MISSING"; exit 1)
          [ -f "docs/core/Implementation/DOC-10_KDS_ObservabilityContract.md" ] && echo "Observability doc: OK" || (echo "Observability doc: MISSING"; exit 1)
          [ -f "docs/core/Implementation/DOC-17_SAIRU_Intelligence_Architecture.md" ] && echo "SAIRU doc: OK" || (echo "SAIRU doc: MISSING"; exit 1)
          grep -Fq "SAIRU" docs/core/SAIOS_SSOT.md
          grep -Fq "KDS" docs/core/Implementation/DOC-10_KDS_ObservabilityContract.md
          if grep -R -E "saios <task>|Autonomous SAIOS Agent Command|SAIRU Shell|Create SAIRU Shell|obsolete AI shell" docs/core src; then
            echo "Stale architecture reference found"
            exit 1
          fi
          echo "Documentation check complete"

      - name: Verify testsaios architecture validation coverage
        run: |
          set -euo pipefail
          grep -Fq '[testsaios] === architecture validation ===' src/shell/commands/process.rs
          grep -Fq 'KDS validation' src/shell/commands/process.rs
          grep -Fq 'SAIRU validation' src/shell/commands/process.rs
          grep -Fq 'freeze diagnostics validation' src/shell/commands/process.rs

  test-subset:
    name: Kernel Smoke Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
          target: x86_64-unknown-none

      - name: Build kernel subset
        run: cargo build --no-default-features --target $KERNEL_TARGET $KERNEL_BUILD_STD
