insmod part_msdos
insmod part_gpt
insmod fat
insmod efi_gop
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod multiboot2

set root=(hd0,msdos1)
set gfxmode=auto
terminal_output gfxterm
set gfxpayload=keep
set timeout=5
set default=0

menuentry "SAIOS" {
	echo "Loading SAIOS..."
	multiboot2 /boot/saios.elf saios.boot=hdd saios.mode=firstboot
	boot
}

menuentry "SAIOS Safe Mode" {
	echo "Loading SAIOS Safe Mode..."
	multiboot2 /boot/saios.elf saios.boot=hdd saios.mode=safe
	boot
}
